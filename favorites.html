<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Афиша событий — Избранное</title>

<style>
  /* Те же стили, что в index.html, + заголовок */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #1B2A4A;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 40px;
    padding: 14px 40px;
    background: #1B2A4A;
    color: white;
  }
  .logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .logo img { width: 40px; height: 40px; object-fit: contain; }
  .logo__text { font-size: 20px; font-weight: bold; color: #F8B4B0; }
  .nav { display: flex; gap: 30px; flex-shrink: 0; }
  .nav__link { color: white; text-decoration: none; font-size: 15px; }
  .nav__link--active { color: #F8B4B0; font-weight: bold; }
  .spacer { flex: 1; }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: white; border-radius: 20px;
    padding: 8px 16px; width: 220px; flex-shrink: 0;
  }
  .search input { border: none; outline: none; font-size: 14px; width: 100%; }
  .user {
    width: 40px; height: 40px;
    border-radius: 50%; overflow: hidden;
    flex-shrink: 0; border: 2px solid #F8B4B0;
  }
  .user img { width: 100%; height: 100%; object-fit: cover; }

  .main {
    display: flex; flex-direction: column; gap: 25px;
    padding: 30px 40px; max-width: 1200px; margin: 0 auto;
  }
  .section__title { font-size: 22px; margin-bottom: 15px; }
  .events__list { display: flex; gap: 20px; flex-wrap: wrap; }

  .card {
    background: white; border-radius: 16px; overflow: hidden;
    flex: 1 1 calc(25% - 15px); min-width: 220px;
    box-shadow: 0 2px 10px rgba(27, 42, 74, 0.08);
    cursor: pointer; transition: transform 0.2s;
  }
  .card:hover { transform: translateY(-3px); }
  .card__img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
  .card__info {
    padding: 15px; display: flex; flex-direction: column;
    gap: 6px; position: relative;
  }
  .card__title { font-size: 16px; color: #1B2A4A; padding-right: 30px; }
  .card__date { font-size: 13px; color: #888; }
  .card__price { font-size: 15px; font-weight: bold; color: #1B2A4A; }
  .card__fav {
    position: absolute; top: 15px; right: 15px;
    font-size: 20px; color: #F8B4B0; cursor: pointer;
  }
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <img src="логотип.png" alt="Логотип">
    <span class="logo__text">Афиша</span>
  </div>
  <nav class="nav">
    <a href="main.html" class="nav__link">Главная</a>
    <a href="event.html" class="nav__link">События</a>
    <a href="favorites.html" class="nav__link nav__link--active">Избранное</a>
    <a href="#" class="nav__link">Профиль</a>
  </nav>
  <div class="spacer"></div>
  <div class="search">
    <span>🔍</span>
    <input type="text" placeholder="Поиск событий...">
  </div>
  <div class="user">
    <img src="avatar.jpg" alt="Профиль">
  </div>
</header>

<main class="main">

  <section>
    <h2 class="section__title">Избранное</h2>
    <div class="events__list">

      <article class="card" onclick="location.href='event.html'">
        <img src="similar1.jpg" alt="Концерт" class="card__img">
        <div class="card__info">
          <h3 class="card__title">Концерт Imagine Dragons</h3>
          <p class="card__date">30 апреля — 19:00</p>
          <p class="card__price">от 2 500 ₽</p>
          <span class="card__fav">♥</span>
        </div>
      </article>

      <article class="card">
        <img src="similar2.jpg" alt="Выставка" class="card__img">
        <div class="card__info">
          <h3 class="card__title">Выставка «Ван Гог»</h3>
          <p class="card__date">18 апреля — 10:00</p>
          <p class="card__price">от 800 ₽</p>
          <span class="card__fav">♥</span>
        </div>
      </article>

    </div>
  </section>

</main>

</body>
</html>
